name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6's wheel bundles the Qt libraries themselves but not the
      # native system libraries they link against, and the bare
      # ubuntu-latest (24.04) runner image ships none of the graphics
      # stack. Without these, importing PySide6.QtGui fails outright
      # with "libEGL.so.1: cannot open shared object file" - which is
      # what made every GUI test module error at *collection* time
      # (pytest exit code 2) on the Linux leg.
      #
      # The list is the set of direct NEEDED entries (objdump -p) of
      # the libraries this app actually loads, minus what Ubuntu
      # guarantees in the base system:
      #   libQt6Gui.so.6            -> libEGL.so.1      (libegl1)
      #                                libGL.so.1       (libgl1)
      #                                libfontconfig.so.1 (libfontconfig1)
      #                                libxkbcommon.so.0  (libxkbcommon0)
      #   libQt6DBus.so.6 (via Gui) -> libdbus-1.so.3   (libdbus-1-3)
      #   platforms/libqoffscreen.so-> libGL.so.1, libX11.so.6,
      #                                libxkbcommon.so.0
      # apt pulls the rest of the chain (libglvnd0, libglx0, libx11-6,
      # libxcb1, libfreetype6, libexpat1, libsystemd0) in as
      # dependencies of these five, so naming them here would be
      # redundant.
      #
      # Deliberately NOT installed: libxcb-cursor0/-icccm4/-keysyms1/
      # -randr0/-render-util0/-shape0/-xinerama0. Those are needed by
      # the *xcb* platform plugin, which this job never loads
      # (QT_QPA_PLATFORM=offscreen below); libqoffscreen.so links only
      # libxcb.so.1, which comes in via libx11-6 anyway.
      - name: Install Qt's native system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict on core/registry/plugins, relaxed on gui)
        run: mypy core cli gui

      - name: Test (pytest)
        env:
          # PySide6/QtPdf need a platform plugin; offscreen works
          # headlessly on all 3 OSes without requiring a real display
          # or a separate Xvfb step.
          QT_QPA_PLATFORM: offscreen
        run: pytest
