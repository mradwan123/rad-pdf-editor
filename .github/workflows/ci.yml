name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict on core/registry/plugins, relaxed on gui)
        run: mypy core cli gui

      - name: Test (pytest)
        env:
          # PySide6/QtPdf need a platform plugin; offscreen works
          # headlessly on all 3 OSes without requiring a real display
          # or a separate Xvfb step.
          QT_QPA_PLATFORM: offscreen
        run: pytest
