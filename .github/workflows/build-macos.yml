name: Build macOS binary

# Manual only (workflow_dispatch) - this does not run on every push/PR
# like the main CI workflow. It exists to produce a real, GitHub-
# Actions-macOS-built standalone binary on demand (see
# packaging/README.md - the Linux build is the only one verified by
# actually running it; this gives macOS the same treatment without
# needing physical Mac hardware).

on:
  workflow_dispatch:

jobs:
  build:
    # macos-latest runners are Apple Silicon (arm64) as of this
    # writing - the produced binary will run on Apple Silicon Macs,
    # not older Intel ones. Switch to macos-13 (the last Intel-runner
    # image) if an x86_64 build is needed instead.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + packaging dependencies
        run: python -m pip install -e ".[dev,packaging]"

      - name: Build standalone binary
        run: pyinstaller --noconfirm --clean packaging/pdf-editor.spec

      # Same discipline packaging/README.md documents for the verified
      # Linux build: a build that merely exits 0 doesn't prove the
      # binary actually launches. Run it headlessly and confirm it
      # stays up rather than crashing immediately.
      - name: Smoke-test the built binary actually launches
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/rad-pdf-editor
          ./dist/rad-pdf-editor &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Binary still running after 5s - looks healthy."
            kill "$PID"
          else
            echo "Binary exited within 5s - build is broken."
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rad-pdf-editor-macos-arm64
          path: dist/rad-pdf-editor
