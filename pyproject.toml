[project]
name = "pdf-editor"
version = "0.1.0"
description = "Local, offline PDF editing suite (merge, split, edit, sign, convert, OCR, automate)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pikepdf>=9.0",
    "PyMuPDF>=1.24",
    "reportlab>=4.2",
    "ocrmypdf>=16.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyhanko>=0.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "xhtml2pdf>=0.2.15",
    "deskew>=1.6",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "workers*", "cli*"]

# --- mypy: strict on core/registry/plugins, relaxed on gui (Qt stubs are incomplete) ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["packaging/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = "gui.*"
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pikepdf.*",
    "ocrmypdf.*",
    "pyhanko.*",
    "pdfplumber.*",
    "reportlab.*",
    "docx.*",
    "pptx.*",
    "xhtml2pdf.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# scikit-image's dependency chain (tifffile, reached via skimage's
# package-level imports even though we only touch skimage.color/
# feature/transform) ships source using Python 3.12-only syntax,
# which chokes mypy at this project's python_version = "3.11" target.
# follow_imports = "skip" avoids parsing that source at all (treated
# as Any) - confirmed by hand to work, and robust to whatever version
# pip resolves, unlike pinning numpy/scikit-image upper bounds.
[[tool.mypy.overrides]]
module = ["skimage.*", "tifffile.*", "imageio.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "deskew.*"
ignore_missing_imports = true

# --- ruff: lint + format ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["core", "gui", "workers", "cli"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov-report=term-missing"
