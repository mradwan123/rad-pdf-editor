[project]
name = "pdf-editor"
version = "0.1.0"
description = "Local, offline PDF editing suite (merge, split, edit, sign, convert, OCR, automate)."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pikepdf>=9.0",
    "PyMuPDF>=1.24",
    "reportlab>=4.2",
    "ocrmypdf>=16.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyhanko>=0.25",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "workers*", "cli*"]

# --- mypy: strict on core/registry/plugins, relaxed on gui (Qt stubs are incomplete) ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["packaging/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = "gui.*"
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["fitz.*", "pikepdf.*", "ocrmypdf.*", "pyhanko.*", "pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

# --- ruff: lint + format ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["core", "gui", "workers", "cli"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov-report=term-missing"
